name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q Luna.zip
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build
        working-directory: Luna
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        working-directory: Luna
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E '^e: ' build.log | sed -E 's#file://[^ ]*/assistant/##' | cut -c1-150 | head -20 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with: { name: Luna-APK, path: Luna/app/build/outputs/apk/debug/app-debug.apk }
